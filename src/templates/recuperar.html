<!DOCTYPE html>
<html>
<head>
    <title>Recuperar contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles2.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Recuperar contraseña</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for mensaje in messages %}
                    <p style="color:red; margin-bottom:10px;">{{ mensaje }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/recuperar" method="POST">
            <input type="email" name="email" placeholder="Email registrado" required>
            <input type="password" name="nueva" placeholder="Nueva contraseña" required>
            <input type="password" name="confirmar" placeholder="Confirmar contraseña" required>
            <button type="submit">Actualizar contraseña</button>
        </form>

        <p><a href="/login">Volver al login</a></p>
    </div>

    <script>
        const form = document.querySelector('form');
        form.addEventListener("submit", (e) => {
            const nueva = document.querySelector('input[name="nueva"]').value;
            const confirmar = document.querySelector('input[name="confirmar"]').value;

            if (nueva !== confirmar) {
                e.preventDefault();
                alert("Las contraseñas no coinciden");
            }
        });
    </script>
</body>
</html>
