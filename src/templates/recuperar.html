{% extends "base.html" %}

{% block contenido %}
    <div style="background-color: #0b132b; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px;">
    <div style="background: #1c2541; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; color: white; font-family: sans-serif;">
        <div class="login-container">
        <h2 style="text-align: center; margin-bottom: 30px;">Recuperar contraseña</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for mensaje in messages %}
                    <p style="color: #f87171; text-align: center; margin-bottom: 10px;">{{ mensaje }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/recuperar" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1;">CORREO</label>
                <input type="email" name="email" placeholder="Email registrado" required
                style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: #0b132b; color: white;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1;">NUEVA CONTRASEÑA</label>
                <input type="password" name="nueva" placeholder="Nueva contraseña" required
                style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: #0b132b; color: white;">
            </div>
            <button type="submit"  style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-bottom: 10px;">ACTUALIZAR CONTRASEÑA</button>
        </form>
            
            <p style="text-align: center; margin-top: 15px;">
                <a href="/login" style="color: #94a3b8; text-decoration: none;">Volver al login</a>
            </p>
        
        </div>
    </div>
    </div>

    <script>
        const form = document.querySelector('form');
        form.addEventListener("submit", (e) => {
            const nueva = document.querySelector('input[name="nueva"]').value;
            const confirmar = document.querySelector('input[name="confirmar"]').value;

            if (nueva !== confirmar) {
                e.preventDefault();
                alert("Las contraseñas no coinciden");
            }
        });
    </script>

{% endblock %}
