<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
    <title>FORMULARIO DE REGISTRO!</title>

</head>

<body>
    <div class="container">
        <div class="tittle">REGISTRO DE USUARIO</div>
        <form ID="form-validation" novalidate>
            <div class="form-group">
                <span>Nombre</span>
                <input type="text" placeholder="Ingrese Nombre" required>
                <small>Por favor ingrese Nombre</small>
            </div>
            <div class="form-group">
                <span>Apellido</span>
                <input type="text" placeholder="Ingrese Apellido" required>
                <small>Por favor ingrese Apellido</small>
            </div>
            <div class="form-group">
                <span>Telefono</span>
                <input type="number" placeholder="Ingrese Telefono" required>
                <small>Por favor ingrese Telefono</small>
            </div>
            <div class="form-group">
                <span>Email</span>
                <input type="email" placeholder="Ingrese Email" required>
                <small>Por favor ingrese Email</small>
            </div>
            <div class="form-group">
                <span>Contraseña</span>
                <input type="password" placeholder="Ingrese Contraseña" required>
                <small>Por favor ingrese Contraseña</small>
            </div>
            <div class="form-group">
                <span>Confirmar Contraseña</span>
                <input type="password" placeholder="Ingrese Contraseña" required>
                <small>Por favor ingrese confirme Contraseña </small>
            </div>
            <div class="button">
                <input type="submit" value="REGISTRARSE">
            </div>
        </form>
    </div>

    <script>
        const addForm = document.getElementById("form-validation");
        addForm.addEventListener("submit", (e) => {
            if(addForm.checkValidity() === false ) {
                e.preventDefault();
                e.stopPropagation();
            }
                addForm.classList.add('was-validated');
            
        });
    </script>

    </div>

</body>

</html>
