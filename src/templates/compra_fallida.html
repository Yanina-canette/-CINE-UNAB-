{% extends "base.html" %}

{% block contenido %}
<div style="background-color: #0b132b; min-height: 100vh; padding: 40px 20px; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center;">
  <div style="text-align: center; max-width: 500px;">
    
    <div style="font-size: 5rem; margin-bottom: 20px;">❌</div>
    <h1 style="font-size: 2rem; margin-bottom: 15px; color: #ef4444;">¡Compra fallida!</h1>
    <p style="color: #cbd5e1; margin-bottom: 30px;">Hubo un problema al procesar tu pago. Por favor intentá de nuevo.</p>

    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('peliculas') }}"
         style="display: inline-block; padding: 12px 30px; background: #3b82f6; color: white; border-radius: 5px; font-weight: bold; text-decoration: none;">
         🎥 Volver a la cartelera
      </a>
    </div>

  </div>
</div>
{% endblock %}
