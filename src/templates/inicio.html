<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine UNAB - Cartelera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles3.css') }}">
</head>
<body style="background-color: #141414; margin: 0; font-family: Arial, sans-serif;">

    <header style="background-color: #0076a3; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo UNAB" style="height: 50px;">
        </div>
        <nav>
            <a href="#" style="color: white; margin-left: 20px; text-decoration: none; font-weight: bold; font-size: 1.2rem;">Películas</a>
            <a href="#" style="color: white; margin-left: 20px; text-decoration: none; font-weight: bold; font-size: 1.2rem;">Precio entradas</a>
        </nav>
    </header>

    <div class="slider-box">
        <ul>
            <li>
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200&auto=format&fit=crop" alt="Publicidad 1"> 
            </li>
            <li>
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop" alt="Publicidad 2"> 
            </li>
            <li>
                <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop" alt="Publicidad 3"> 
            </li>
        </ul>
    </div>

    <h2 style="color: white; padding-left: 40px; margin-top: 40px; font-size: 2rem;">Películas en Cartelera</h2>

    <main class="contenedor-cartelera">
        {% for peli in peliculas %}
        <div class="tarjeta-pelicula">
            <div class="imagen-contenedor">
                <img src="{{ peli.poster_url }}" alt="Póster de {{ peli.titulo }}">
            </div>
            <div class="info-pelicula">
                <h3>{{ peli.titulo }}</h3>
                <p class="sinopsis">{{ peli.sinopsis }}</p>
            </div>
        </div>
        {% endfor %}
    </main>

    <footer style="text-align: center; padding: 20px; background-color: #141414; color: #666; margin-top: 50px;">
        <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </footer>
<script>
    // Buscamos el carrusel y las flechas en la página
    const carrusel = document.querySelector('.contenedor-carrusel'); // Cambia esto por la clase real de tu carrusel si es otra
    const botonSiguiente = document.querySelector('.flecha-derecha'); // Cambia esto por la clase de tu flecha derecha
    
    if (botonSiguiente) {
        // Configuramos para que "haga clic" solo cada 4000 milisegundos (4 segundos)
        setInterval(() => {
            botonSiguiente.click();
        }, 4000);
    }
</script>
</body>
</html>
